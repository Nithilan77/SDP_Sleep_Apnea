{% macro bars(rows, key='auroc', label='name', fmt='%.3f', cls='') %}<div class="bars">{% for r in rows %}<div class="bar {{cls}}"><div>{{r[label]}}{% if r.get('spo2') %}<span class="tag">needs SpO2</span>{% endif %}</div><div class="t"><div class="f" style="width:{{(100*r[key])|round(1)}}%"></div></div><div class="v">{{ r.get('txt') or (fmt % r[key]) }}</div></div>{% endfor %}</div>{% endmacro %}
